# All secrets and environment-specific values live in .env (local) or Dokploy env vars.
# This file only maps those variables and keeps non-sensitive defaults.

# Server — bind every interface so host 145.241.187.174:8181 reaches the container
server.port=${SERVER_PORT}
server.address=${SERVER_ADDRESS}
server.error.include-message=always
#
# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Mail (SMTP)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
spring.mail.properties.mail.debug=false
spring.mail.test-connection=false

# App
app.jwt-secret=${JWT_SECRET}
app.jwt-days=30
app.enc-key=${APP_ENC_KEY}
app.engine-url=${ENGINE_URL}
app.internal-key=${INTERNAL_KEY}
app.mail-from=${MAIL_FROM}
app.cors=${APP_CORS}
app.report-cron=${REPORT_CRON}
app.super-admin-email=${SUPER_ADMIN_EMAIL}
app.super-admin-password=${SUPER_ADMIN_PASSWORD}
